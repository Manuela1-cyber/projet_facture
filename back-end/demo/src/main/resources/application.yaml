server:
  port: 8081

spring:
  application:
    name: demo

  datasource:
    url: jdbc:mysql://localhost:3306/springboot
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: votre-email@gmail.com // Mets ton email ici après avoir créé un mot de passe d'application dans ton compte Google
    password: votre-mot-de-passe-app // Mets ton mot de passe d'application ici
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  frontend:
    url: http://localhost:3000
  mail:
    from: votre-email@gmail.com // Mets ton email ici après avoir créé un mot de passe d'application dans ton compte Google
    from-name: Facturation App
